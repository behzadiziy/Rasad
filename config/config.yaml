scheduler:
  interval_minutes: 30
  active_hours: "08:00-23:00"
  timezone: "Asia/Tehran"

scraping:
  enabled_platforms: ["jobvision", "jobinja"]
  max_pages_per_keyword: 2

city_aliases:
  mashhad: ["mashhad", "مشهد"]
  tehran: ["tehran", "تهران"]

search_profiles:
  - profile_name: "AI & Automation"
    # Each item is a synonym group; a nested list groups synonyms. A keyword in
    # the title always passes. Otherwise the description needs terms from at
    # least `description_min_hits` different groups (synonyms count once).
    keywords:
      - ["AI", "هوش مصنوعی"]
      - "n8n"
      - "Agentic"
      - "LLM"
      - "RAG"
    description_min_hits: 2
    exclude_keywords: ["کارآموز", "Intern"]
    location_rules:
      - city: "mashhad"
        remote_only: false   # Mashhad: accept on-site, hybrid, and remote
      - city: "ALL"
        remote_only: true    # Any other or unknown city: accept REMOTE only

# Probable duplicates: the same position on both boards, or reposted. They are
# labeled in notifications, never hidden.
duplicates:
  window_days: 45                # first seen at most this many days apart
  title_overlap_threshold: 0.8   # |shared title tokens| / |tokens of the shorter title|

# ── Phase 2: resume tailoring ──────────────────────────────────────────────
# Remove the whole `llm` section to disable resume tailoring and the review bot.
llm:
  provider: "gemini"           # the only provider for now; "openai" and "openrouter" are planned
  # Source: https://ai.google.dev/gemini-api/docs/models (checked 2026-10-18):
  # Gemini 3.8 Flash, a stable (generally available) Flash model.
  model: "gemini-3.8-flash"
  temperature: 0.3             # 0 to 2
  max_output_tokens: 8192
  timeout_seconds: 120

tailoring:
  master_resume_path: "config/master_resume.yaml"
  output_dir: "data/resumes"
  cover_letter: true
  max_versions_per_job: 3      # the first version plus up to two regenerations
  persian_ratio_threshold: 0.3 # share of Persian letters in a job's text that selects a Persian resume

bot:
  poll_timeout_seconds: 30     # Telegram getUpdates long-poll timeout
  state_path: "data/bot_state.json"

# ── Phase 3: application submission ───────────────────────────────────────
apply:
  enabled: false
  daily_limit: 10
  confirm_before_submit: false
  confirm_timeout_minutes: 30
  screenshots_dir: "data/applications"
