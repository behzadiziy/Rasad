# Master resume: the only source of facts for resume tailoring.
#
# Copy this file to config/master_resume.yaml (gitignored) and replace the
# fictional person below with your own data. Check it with:
#   uv run python -c "from src.resume.models import load_master_resume; load_master_resume('config/master_resume.yaml')"
#
# Format:
# - Every text is bilingual: {fa: ..., en: ...}. At least one language is
#   required; the other falls back to it. A plain string (e.g. `PostgreSQL`)
#   means the same text in both languages; use it for names written the same way.
# - Every experience, bullet, project, skill, education, certification, and
#   language has an `id`: kebab-case, unique in the whole file, and stable
#   (tailored resumes refer to items by ID, so do not rename IDs later).
# - Dates are YYYY-MM. `start`/`end`/`date` are Gregorian; the optional
#   `*_jalali` fields hold the same month in the Jalali calendar. A current
#   position has no `end`.
# - Tailoring may only select, reorder, and rephrase what is written here, so
#   state every fact, number, and tool you want the tailored resumes to use.

