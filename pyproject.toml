[project]
name = "job-hunter-agent"
version = "0.1.0"
description = "Async scraper for JobVision and Jobinja with a Persian-aware rule engine, SQLite state, and Telegram notifications"
readme = "README.md"
authors = [
    { name = "behzadiziy", email = "behzadiziy@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "selectolax>=0.3",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "python-dotenv>=1",
    "aiosqlite>=0.19",
    "httpx[socks]>=0.26",
    "tenacity>=8",
    "apscheduler>=3.10,<4",
    "loguru>=0.7",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
